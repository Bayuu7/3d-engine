<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Editor</title>
  <style>
    html, body { height:100%; margin:0; background:#0b0b10; color:#ddd; font-family:sans-serif; }
    #root { display:flex; height:100%; }
    .sidebar { width:280px; background:#121219; padding:8px; box-sizing:border-box; overflow:auto; }
    .main { flex:1; position:relative; }
    canvas { width:100%; height:100%; display:block; }
    .toolbar { position:absolute; top:8px; left:8px; display:flex; gap:8px; }
    .btn { padding:6px 10px; background:#223; color:#ddd; border:1px solid #334; cursor:pointer; }
    .panel { margin-bottom:12px; }
    .section-title { font-weight:bold; margin-bottom:6px; }
    .entity-item { padding:4px 6px; cursor:pointer; border-bottom:1px dotted #334; }
    .entity-item:hover { background:#1a1a26; }
  </style>
</head>
<body>
  <div id="root">
    <div class="sidebar">
      <div id="hierarchy"></div>
      <div id="inspector"></div>
    </div>
    <div class="main">
      <div class="toolbar" id="toolbar"></div>
      <canvas id="viewport" width="960" height="540"></canvas>
      <div id="overlay"></div>
    </div>
  </div>
  <script type="module" src="./main.js"></script>
</body>
</html>
