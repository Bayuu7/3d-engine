<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>3D Engine Editor</title>
    <style>
      html, body { height: 100%; margin:0; background:#1b1d22; color:#ddd; font-family: system-ui, sans-serif; }
      .app { display: grid; grid-template-columns: 280px 1fr 320px; grid-template-rows: 48px 1fr; height: 100%; }
      .toolbar { grid-column: 1 / 4; grid-row: 1; display: flex; align-items: center; gap: 8px; padding: 8px; border-bottom: 1px solid #333; background: #20232a; }
      .left { grid-column: 1; grid-row: 2; border-right: 1px solid #333; overflow:auto; }
      .center { grid-column: 2; grid-row: 2; position: relative; }
      .right { grid-column: 3; grid-row: 2; border-left: 1px solid #333; overflow:auto; }
      canvas { width: 100%; height: 100%; display:block; background:#111; }
      .panel { padding: 8px; }
      .section-title { font-weight: 600; margin: 8px 0; }
      .btn { background:#2b2f36; color:#ddd; border:none; padding:6px 10px; border-radius:4px; cursor:pointer; }
      .btn:hover { background:#39404a; }
      .item { padding:6px; border-radius:4px; }
      .item:hover { background:#2a2e35; }
      .overlay { position:absolute; left:0; top:0; right:0; bottom:0; pointer-events:none; }
    </style>
  </head>
  <body>
    <div id="app" class="app">
      <div class="toolbar" id="toolbar"></div>
      <div class="left" id="left"></div>
      <div class="center" id="center">
        <canvas id="viewport"></canvas>
        <div class="overlay" id="overlay"></div>
      </div>
      <div class="right" id="right"></div>
    </div>
    <script type="module" src="/frontend/index.js"></script>
  </body>
</html>
